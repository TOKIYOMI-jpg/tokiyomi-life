<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>TOKIYOMI／時詠</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Layout: 月夜の湖畔の小径。上に年齢と持ち札、中央に「いま起きていること」、下に流れていく人生の記録。単一の夜の世界観 */
:root{
  color-scheme:dark;
  --night:#0b1914; --forest:#12271f; --panel:#15291f; --panel-2:#1c3529; --line:#2f4c3f;
  --moon:#ece6d6; --mist:#a8b8ad; --gold:#cdb06a; --gold-dim:#8f7a45; --ember:#e39a6c; --dew:#93c9a6;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.nudge{margin:4px 0 0;font-size:13.5px;font-weight:700;color:#e6c34a;animation:nudgein .35s ease-out}@keyframes nudgein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.needfix{outline:2px solid #e6c34a;outline-offset:6px;border-radius:12px}input.needfix{outline-offset:2px}
/* v36.21：必須項目の文字入力欄は黄色の罫線 */
input.req,textarea.req{border:1.5px solid #e6c34a!important}input.req:focus{outline:2px solid #e6c34a;outline-offset:1px}
/* v36.17：スマホでは、上に固定するのは細い1行だけ（年齢・速さ・進める）。資産や速さの切り替えは、ページと一緒に流れる */
.hudmini{display:none}
@media (max-width:599px){
  .hudmini{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;align-items:center;gap:10px;padding:6px 0;background:color-mix(in srgb,var(--night) 95%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .hudmini .age{font-size:22px}.hudmini .age small{font-size:12px}.hudmini .yr{font-size:13px}
  .hudmini .mpace{font-size:12px;color:var(--mist);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .hudmini button{margin-left:auto;padding:6px 14px;font-size:14px}
  .hud{position:static!important;backdrop-filter:none!important;background:transparent!important;padding-block:6px!important;gap:6px!important}
  .hud .hudtop{display:none!important}
  .hud #pp{display:none!important}
  .chip{font-size:12px;padding:1px 8px}
  .ctrl .sp button{padding:5px 8px;font-size:12px}.ctrl .sp small{display:none}
  .spdesc{font-size:12px}
}

.feed li.auto .t small{color:var(--gold)}
.autobar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--gold);border:1px dashed var(--gold-dim);border-radius:10px;padding:6px 10px}
.autobar button{padding:4px 12px;font-size:13px}
html{background:var(--night)}
body{background:var(--night);color:var(--moon);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(circle at 80% 11%, rgba(236,230,214,.95) 0 30px, rgba(236,230,214,.16) 32px, rgba(236,230,214,.05) 90px, transparent 170px),
   radial-gradient(1px 1px at 12% 18%, rgba(236,230,214,.7), transparent 2px),
   radial-gradient(1px 1px at 34% 9%, rgba(236,230,214,.5), transparent 2px),
   radial-gradient(1.5px 1.5px at 56% 22%, rgba(236,230,214,.6), transparent 2px),
   radial-gradient(1px 1px at 90% 36%, rgba(236,230,214,.45), transparent 2px),
   radial-gradient(1px 1px at 22% 40%, rgba(236,230,214,.35), transparent 2px),
   linear-gradient(180deg,#0a1813 0%, #0f2219 50%, #0a1712 100%)}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;
  background:radial-gradient(ellipse 12% 45% at 80% 0%, rgba(236,230,214,.14), transparent 70%),
   repeating-linear-gradient(180deg, rgba(236,230,214,.03) 0 1px, transparent 1px 9px),
   linear-gradient(180deg, transparent, rgba(8,20,15,.9))}
.trees{position:fixed;left:0;right:0;bottom:34%;height:80px;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:24px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.4}
p{margin:0}
.muted{color:var(--mist)} .small{font-size:13px}
.latin{font-family:var(--f-latin);letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:var(--moon);background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 18px;transition:border-color .2s,background .2s,transform .15s}
button:hover{border-color:var(--gold-dim)}
button:active{transform:scale(.98)}
button.gold{background:var(--gold);border-color:var(--gold);color:#16231b;font-weight:700}
button.gold:hover{background:#dcc07c}
button.ghost{border-color:#5d8573;color:var(--moon);padding-inline:14px}
button.ghost:hover{color:var(--moon);border-color:var(--gold-dim)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit;color:var(--moon);background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* みやじい */
.miya{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start}
.miya .face{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold-dim);display:grid;place-items:center;font-family:var(--f-display);color:var(--gold);font-size:19px;background:radial-gradient(circle at 50% 35%,#24402f,#11241b)}
.miya .say{font-family:var(--f-display);font-size:19px;line-height:1.65;min-width:0}
.miya .who{font-size:11px;color:var(--mist);letter-spacing:.1em;display:block;font-family:var(--f-body)}

/* タイトル */
.title{padding-block:44px 20px;display:flex;flex-direction:column;gap:16px}
.title .brand{font-family:var(--f-latin);letter-spacing:.32em;color:var(--gold);font-size:14px}
.title .kicker{font-family:var(--f-display);font-size:16px;color:var(--gold);letter-spacing:.3em}
.title h1{font-size:clamp(18px,4vw,24px);letter-spacing:.18em;color:var(--mist);letter-spacing:.04em;line-height:1.2;font-weight:800}
.title .bloom{font-family:var(--f-display);font-size:clamp(34px,8.5vw,60px);line-height:1.2;font-weight:800;margin:0}
.demo{position:relative;border:1px solid rgba(201,162,58,.45);border-radius:14px;overflow:hidden;background:#0b1512;max-width:720px;width:100%;margin-inline:auto}
.demo canvas,.demo canvas.pix{display:block;width:100%;max-width:none;height:auto;margin:0;border:0;border-radius:0;image-rendering:pixelated}
.demo .dcap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;background:linear-gradient(transparent,rgba(5,12,10,.85));font-family:var(--f-display);font-size:clamp(13px,3.4vw,16px);letter-spacing:.05em}
.demo .dcap b{color:var(--gold);margin-right:.6em;font-weight:700}
.demo .dtag{position:absolute;top:8px;left:10px;font-family:var(--f-latin);font-size:11px;letter-spacing:.24em;color:var(--gold);opacity:.85}
.title .bloom b{color:var(--gold);font-weight:800}
.title .sub{font-family:var(--f-display);font-size:clamp(15px,3.6vw,18px);color:var(--mist);letter-spacing:.06em}
.rule{width:64px;height:1px;background:var(--gold-dim)}
.title h1 .slash{color:var(--gold);font-weight:500;margin-inline:.08em}

/* 質問（タップで答える） */
.dots{display:flex;gap:6px}
.dots i{width:24px;height:3px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--gold)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.choices button{border-radius:12px;padding:14px 12px;text-align:center;background:var(--panel-2);border-color:var(--line)}
.choices button.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.choices button small{display:block;font-size:12px;color:var(--mist)}
.qlabel{font-size:14px;color:var(--mist)}
.qblock{display:flex;flex-direction:column;gap:8px}

/* 7軸のかんたん設定 */
.ax{display:grid;grid-template-columns:9.5em 1fr;gap:6px 12px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.ax:first-of-type{border-top:0;padding-top:0}
.ax .nm{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--gold);display:flex;flex-direction:column;gap:2px}
.ax .nm .look{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--mist);line-height:1.5}
.ax .ideal{font-size:14px;padding:7px 10px}
.near{display:flex;gap:6px;flex-wrap:wrap}.near button{padding:6px 12px;font-size:13px;border-radius:999px}.near button.on{background:var(--gold);color:#16231b;border-color:var(--gold);font-weight:700}
.ax.off{opacity:.45}
.ax .rows{display:flex;flex-direction:column;gap:6px;min-width:0}
.lv{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.lv span.l{font-size:12px;color:var(--mist);width:4.5em}
.lv button{padding:4px 0;width:38px;border-radius:8px;font-size:13px}
.lv button.on{background:var(--gold);color:#16231b;border-color:var(--gold);font-weight:700}
.lv button.min.on{background:var(--ember);border-color:var(--ember)}
.stars button{border:0;padding:0 2px;font-size:22px;line-height:1;color:var(--line);background:none;width:auto}
.stars button.on{color:var(--gold);background:none}
@media (max-width:480px){.ax{grid-template-columns:1fr}.lv button{width:34px}}

/* HUD */
.hudtop .ctrl{margin-left:auto}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 93%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.ctrl button{padding:7px 14px;font-size:14px}
.hudtop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.age{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1}
.age small{font-size:16px}
.yr{font-family:var(--f-latin);color:var(--gold);letter-spacing:.12em;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.ok{border-color:var(--dew);color:var(--dew)} .chip.ng{border-color:var(--ember);color:var(--ember)} .chip.hold{border-color:var(--gold-dim);color:var(--gold)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl .sp{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.ctrl .sp button{border:0;border-radius:0;padding:6px 12px;font-size:13px}.ctrl .sp small{font-size:11px;color:var(--mist)}
.ctrl .sp button.on{background:var(--panel-2);color:var(--gold)}
.spdesc{margin:0;font-size:12.5px;line-height:1.6}

/* カード */
.spread{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.spread{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{perspective:900px;position:relative}
.card .in{display:grid;width:100%;min-height:260px;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.open .in{transform:rotateY(180deg)}
.card .face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;border:1px solid var(--gold-dim);display:flex;flex-direction:column}
.card .back{cursor:pointer;background:
   radial-gradient(circle at 50% 40%, rgba(205,176,106,.24) 0 17%, transparent 18%),
   radial-gradient(circle at 57% 36%, #173326 0 14%, transparent 15%),
   repeating-conic-gradient(from 0deg at 50% 40%, rgba(205,176,106,.08) 0 6deg, transparent 6deg 18deg),
   linear-gradient(160deg,#173326,#0e2018);align-items:center;justify-content:flex-end;padding:14px;text-align:center;gap:2px;width:100%;color:var(--moon);font:inherit}
.card .back::before{content:"";position:absolute;inset:7px;border:1px solid rgba(205,176,106,.35);border-radius:8px;pointer-events:none}
.card .back .md{font-family:var(--f-display);font-size:18px;font-weight:800;position:relative}
.card .back .tap{font-size:11px;color:var(--mist);position:relative}
.card .front{transform:rotateY(180deg);background:linear-gradient(170deg,#1f3a2c,#13281e);padding:14px 12px;gap:8px}
.card .front .md{font-family:var(--f-latin);letter-spacing:.18em;font-size:12px;color:var(--gold);text-transform:uppercase}
.card .front .act{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.45}
.card .front .why{font-size:12.5px;color:var(--mist);line-height:1.55;padding:0}
.card .front .tags{display:flex;flex-wrap:wrap;gap:4px}
.card .front .tags span{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.card .front .warnline{font-size:12px;color:var(--ember);line-height:1.5}
.card .front .go{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.card .front .go button{padding:8px 10px;font-size:14px}
.card .front .more{font-size:12px;color:var(--mist);line-height:1.55;display:flex;flex-direction:column;gap:4px}
.card.on .face{border-color:var(--gold);box-shadow:0 0 24px rgba(205,176,106,.22)}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}}
/* v36.22：スマホでは、カードを横長にして1列に並べる。めくる前は低い帯、めくると中身が開く */
@media (max-width:599px){
  .spread{grid-template-columns:1fr;gap:8px}
  .card .in{min-height:0;transition:none;transform:none!important}
  .card .face{backface-visibility:visible;-webkit-backface-visibility:visible}
  .card .front{transform:none;display:none}
  .card.open .front{display:flex}.card.open .back{display:none}
  .card .back{min-height:76px;flex-direction:row;justify-content:flex-start;align-items:center;gap:14px;padding:12px 18px;text-align:left;
    background:radial-gradient(circle at 34px 50%, rgba(205,176,106,.28) 0 18px, transparent 19px),repeating-conic-gradient(from 0deg at 34px 50%, rgba(205,176,106,.09) 0 6deg, transparent 6deg 18deg),linear-gradient(100deg,#173326,#0e2018)}
  .card .back .md{margin-left:48px;font-size:19px}
  .card .back .tap{margin-left:auto}
}

/* 人生の記録 */
.feed{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px solid var(--gold-dim);display:flex;flex-direction:column;gap:6px}
.feed li{position:relative;display:grid;grid-template-columns:3.6em 1fr;gap:8px;animation:rise .4s ease-out}
.feed li::before{content:"";position:absolute;left:-23px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--night);border:1px solid var(--gold-dim)}
.feed li.pick::before{background:var(--gold);border-color:var(--gold)}
.feed li.big .t{font-weight:700}
.feed li.big::before{border-color:var(--moon);background:var(--moon)}
.feed li.end::before{background:var(--ember);border-color:var(--ember)}
.feed .a{color:var(--mist);font-size:13px;font-variant-numeric:tabular-nums;padding-top:2px}
.feed .t{min-width:0}
.feed .t small{color:var(--mist);font-size:12px;margin-left:6px}
@keyframes rise{from{transform:translateY(-4px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.feed li{animation:none}}

details.box{border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel) 80%,transparent)}
details.box>summary{cursor:pointer;padding:14px 18px;font-family:var(--f-display);font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.box>summary::after{content:"＋";color:var(--gold)}
details.box[open]>summary::after{content:"－"}
details.box>.inner{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.radar{width:100%;max-width:420px;align-self:center}
.radar text{font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mist)}
.legend svg{vertical-align:middle;margin-right:4px}
.warn{border-left:3px solid var(--ember);padding:6px 12px;background:rgba(227,154,108,.08);border-radius:0 8px 8px 0;font-size:14px}
.okline{border-left:3px solid var(--dew);padding:6px 12px;background:rgba(147,201,166,.07);border-radius:0 8px 8px 0;font-size:14px}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.menu button{font-size:13px;padding:6px 12px}
.big3{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.big3 div{display:flex;flex-direction:column}
.big3 .k{font-size:12px;color:var(--mist)} .big3 .v{font-family:var(--f-display);font-size:22px;font-weight:700}
.scene{font-family:var(--f-display);font-size:17px;line-height:1.9;border-left:1px solid var(--gold-dim);padding-left:16px;display:flex;flex-direction:column;gap:6px}
.scene .when{font-family:var(--f-latin);color:var(--gold);letter-spacing:.2em;font-size:12px}
.pix{width:100%;max-width:480px;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:10px;border:1px solid var(--gold-dim);display:block;align-self:center;background:#0b1914}
.screen{display:flex;flex-direction:column;gap:6px;align-items:center}
.pix.big{max-width:100%;width:100%;border-radius:14px;border-color:var(--gold)}
.cap{font-family:var(--f-display);font-size:15px;color:var(--gold);text-align:center;letter-spacing:.06em}
.desc{font-family:var(--f-display);font-size:17px;line-height:1.8}
.score{display:flex;align-items:baseline;gap:12px}
.score .k{font-family:var(--f-display);font-size:16px;color:var(--mist)}
.score .v{font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--gold);line-height:1}
.score .v small{font-size:16px;color:var(--mist);font-weight:500}
.verdict{font-family:var(--f-display);font-size:18px;font-weight:700}
.verdict.ng{color:var(--ember)}.verdict.ok{color:var(--dew)}.verdict.hold{color:var(--gold)}
.reason{font-size:15px;line-height:1.8}
.mdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.f2{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mist);min-width:0}
.u{display:flex;align-items:center;gap:6px}.u em{font-style:normal;font-size:12px;color:var(--mist);white-space:nowrap}
.plans{display:flex;flex-direction:column;gap:8px}.plan{display:grid;grid-template-columns:7em 1fr 1fr;gap:8px;align-items:center;font-size:14px}
@media (max-width:420px){.plan{grid-template-columns:1fr 1fr}.plan>span:first-child{grid-column:1/-1}}
/* 今の暮らしのインジケーター */
.stagewrap{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
.caprow{display:grid;grid-template-columns:1fr;gap:10px}.caprow .cap{margin:0}
.indbox .ind{border:0;background:none;padding:0}.indbox .ind .mini{height:240px}
.stagewrap .pix.big{align-self:start}
.ind{border:1px solid var(--gold-dim);border-radius:14px;background:linear-gradient(180deg,#132a20,#0e2018);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.ind .mini{display:block;width:100%;height:260px}
.ind .lk{font-family:var(--f-display);font-size:14px;color:var(--mist)}
.mini text.flash{animation:glowt 1.4s ease-out}@keyframes glowt{0%{fill:#fff3c0}}
@media (prefers-reduced-motion:reduce){.mini text.flash{animation:none}}
@media (min-width:600px){main{max-width:1040px}.stagewrap,.caprow{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);align-items:stretch}.ind{contain:size}.ind .mini{flex:1 1 0;min-height:0;height:100%}}

、損失分布。銘柄・売買推奨や利益保証をしない。"],["M013","健康寿命と支援を受ける暮らし","主人公が支援者と一日の予定を囲み、続けたい活動を伝える。","助けを受けながらでも、続けたいことは何？","住まい・移動・支援の組合せを大きく変える案を検討する。","今の暮らしに支援を加え、望む活動を続ける。","一つの動作や外出から、助けがあればできることを試す。","BFRH","","","健康寿命は集団の指標。平均の年齢で個人を一律に要介護・不幸せへ切り替えない。個別の生活機能と支援を確認。"],["M014","死後の準備と希望の共有","主人公が連絡先と希望を整理し、伝えたい相手や相談先へ話す。","どんなことを、誰に分かる形で残したい？","書類・契約・財産・依頼先をまとめて点検する。","今ある記録を生かし、必要な準備を順に進める。","まず大切な連絡先と希望を一つ残す。","RMF","","","本人の意思、契約・法令・地域の手続、保管・閲覧権限。死亡後は本人へ選択を求めない。"],["M015","相続する・引き継ぐ","主人公が財産や契約の書類を整理し、関係者と相談する準備をする。","受け継ぐことと、抱え込むことをどう分けたい？","資産・負債・生活への影響をまとめて専門相談する。","判明した資料から関係と必要な確認を整理する。","まず実物の書類を集め、期限と相談先を確かめる。","MRF","","","法律上の関係、資産・負債、期限、手続、税を個別確認。金額や承継結果を自動確定しない。"],["M016","転居・移住・二拠点","主人公が候補の町を歩き、住居と仕事・交通・支援先を確かめる。","場所を変えることで、何をかなえたい？","生活拠点を変える案を具体化する。","今の拠点を残して短い滞在や二拠点を検討する。","まず下見や相談で生活条件を確かめる。","FMWR","","","住居費・移動・仕事・医療・支援・契約条件。地域平均を本人の確定支出にしない。"],["M017","健康管理と習慣の選択","主人公が日々の記録を見て、無理なく続けたい行動を選ぶ。","長く続けたいのは、どんな過ごし方？","生活や仕事の時間配分を大きく見直す。","既存の日課へ本人に合う活動や休息を組み込む。","まず一つの行動を試し、負担や実感を確かめる。","BHFM","","","健診・生活習慣の資料と個別の状態。行動から病気予防や寿命延長を保証しない。"],["M018","コミュニティー・自治会との距離","地域の案内を受け、主人公が参加方法や役割を担当者へ聞く。","どれくらいの距離なら、自分らしく関われる？","運営や新しい活動づくりに関わる。","自分に合う頻度と担当で参加する。","見学、単発参加、辞退など負担の少ない関わりを選ぶ。","RCF","","","実在の活動、参加条件、時間・費用、本人の希望。参加量を幸福度へ直接変換しない。"],["M019","身寄りのない・頼れる人がいない暮らし","主人公が困ったときの連絡先を整理し、家族以外の相談先を探す。","何かあったとき、どんな助けがあると安心？","住まい・相談・支援体制をまとめて検討する。","今ある縁と地域の支援を組み合わせる。","まず一つの窓口や関係を確かめる。","RMBF","","","親族の有無、交流、支援可能性を別々に確認。独居・未婚を孤立と決めつけず、利用可能な支援を実確認。"],["M020","50歳の節目と幸せの見直し","主人公が40代の記録と今の暮らしを並べ、次の十年を考える。","十年前の望みを、今も大切にしたい？","長く望んだ大きな変更を、条件から検討する。","今ある良さを残し、優先順位を一部見直す。","まず小さな体験や一日の描き直しをする。","WRHBCMLF","","","50歳で自動的に価値観を変えない。本人の現在地・重要度・最低ラインの確認を主な根拠とする。"],["M021","60歳の節目と役割の選び直し","主人公が仕事と家計の予定を囲み、これから残したい役割を書く。","肩書きの先に、どんな一日を持ちたい？","働き方や拠点の再編を検討する。","続けたい役割を選び、負担を調整する。","まず情報確認と短い試行から始める。","WRHBCMLF","","","年齢だけで退職や年金の入金を確定しない。本人の契約・制度・希望を確認。"],["M022","70歳の節目と望む暮らし","主人公が日課と人とのつながりを見て、続けたいことを選ぶ。","これからも、自分で選んでいたいことは何？","支援や生活拠点も含めて今後の暮らしを設計する。","今の生活を生かし、負担や移動を調整する。","今の満足を確かめ、必要な一つだけを変える。","WRHBCMLF","","","70歳を衰え・孤独・要介護の境界にしない。本人の機能・希望・環境が根拠。"],["M023","趣味・学習・余暇との向き合い方","主人公が教材や趣味の道具を並べ、使いたい時間を考える。","楽しむため？ 上達するため？ 今は何を求めたい？","まとまった時間や費用を使う挑戦を検討する。","日課に入る量で続ける。","一度だけ体験する、休む、やめることも選ぶ。","HLFM","","","参加費、時間、実施条件と本人の実感。上達・収益化・資格を全員の目標にしない。"],["M024","リスクとメリットを比べる","主人公が二つの計画の費用・時間・不確実な点を紙へ並べる。","得たいものと、引き受けられない負担は何？","大きく動く案について、負担できる条件を確認する。","得意や既存資源を使い、影響を限定する。","小さく試す、待つ、何もしない案も比較する。","WRHBCMLF","","","確実な費用、利益の見込み、最大想定損失、期間、回復可能性、依存関係。根拠のない総合リスク点を作らない。"],["M025","親の介護・看取りと分担","主人公がきょうだいの予定表を囲み、本人の望む暮らしを聞く。","親の望みと、自分の暮らしをどう守りたい？","住まい・勤務・支援体制の再編を検討する。","家族と外部支援で役割を調整する。","まず困る一場面を相談する。","RWMB","","","必要な支援、本人意思、利用条件、家族の負担。親の年齢だけで発火させない。"],["M026","子どもの進路・独立・同居再開","主人公が子の希望と家計・部屋の使い方を話し合う。","応援したいことと、自分が守りたいことは何？","支援と自分の計画を含め生活を再編する。","支援できる範囲と役割を調整する。","まず子の希望を聞き、一つの確認から始める。","RMF","","","対象者の実在、意思、教育・住居費、支援範囲。成人した子の意思を自動決定しない。"],["M027","失業・倒産・廃業と収入の立て直し","主人公が契約や入金の資料を整理し、当面の生活を確認する。","今すぐ必要なことと、次に目指したいことは？","新しい分野や事業へ移る案を検討する。","経験を生かす仕事やつなぎの収入を探す。","まず契約・資金・相談できる支援を確認する。","WMBF","","","契約、失職・廃業の状態、適用給付、求人・経営データ。平均値から個人の成功率を作らない。"],["M028","配偶者の退職と生活時間","相手の退職後、主人公が家で過ごす時間と家事を相談する。","二人の時間と、一人の時間をどう持ちたい？","二人の働き方と拠点を再検討する。","共有する時間と別々の時間を決める。","まず一週間の過ごし方を試す。","RWMF","","","相手の就業・収入・本人の希望。配偶者の退職を本人の退職と混同しない。"],["M029","認知機能・判断力の変化と意思の支援","主人公が困る場面を記録し、望む支援を信頼できる人へ伝える。","どんなことを、自分で決め続けたい？","生活と支援・契約の仕組みをまとめて相談する。","できることを続け、必要な確認を補う。","まず一つの困りごとを専門窓口へ相談する。","BFRM","","","個別の評価、意思、利用制度、法的判断。年齢や忘れ物だけで診断・判断能力喪失を確定しない。"],["M030","家族間の対立・疎遠","主人公が話し合いのメモを作り、連絡の取り方や距離を考える。","つながりを保つことと、距離を取ることをどう考えたい？","役割・費用・住まいの分け方を大きく見直す。","合意できる部分と難しい部分を整理する。","今は距離を置く、第三者へ相談する等を選ぶ。","RMBF","","","本人が述べた関係と安全、費用や義務の実条件。和解を唯一の正解にしない。"],["M031","住まいの維持と住み替え","主人公が家の中を歩き、修繕・管理・動線の困りごとをメモする。","この家で残したいことは、何？","住み替えや住居規模の変更を検討する。","必要な修繕と外部の手伝いを組み合わせる。","まず一か所の見積もりや見学をする。","MBFR","","","修繕費、契約、住居と本人の機能、支援可能性。持家の価値と使える現金を分ける。"],["M032","運転・移動手段の変更","主人公が車の鍵と交通案内を見て、通院や交流への道を試す。","行き続けたい場所は、どこ？","生活拠点や次の仕事を検討する。","交通機関・送迎・支援を組み合わせる。"    (has?'<textarea id="ex" readonly rows="4">'+esc(JSON.stringify(G))+'</textarea><div class="actions"><button id="cp">コピーする</button><span class="small muted" id="cm"></span></div>':'')+
   '<textarea id="im" rows="3" placeholder="書き出した文字列を貼り付け"></textarea><div class="actions"><button id="ld">読み込んで再開</button><span class="small" id="lm"></span></div></div></details>'+
   '<div class="actions"><button class="ghost" id="b">もどる</button></div></section>');
  if(has){$('sf').onclick=function(){saveFile(JSON.stringify(G),function(t){$('sfm').textContent=t})};
    $('cp').onclick=function(){var t=$('ex');var ok=function(){$('cm').textContent='コピーしました'},ng=function(){t.select();$('cm').textContent='選択しました。長押しかCtrl+Cでコピーしてください'};try{navigator.clipboard.writeText(t.value).then(ok,ng)}catch(e){ng()}}}
  $('lf').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){loadText(String(r.result),function(t){$('lfm').textContent=t})};r.onerror=function(){$('lfm').textContent='ファイルを読めませんでした'};r.readAsText(f)};
  $('ld').onclick=function(){loadText($('im').value,function(t){$('lm').textContent=t})};
  $('b').onclick=function(){G.phase=G.back||'title';render()};
}

G=fresh(); render();
</script>


</body></html>
